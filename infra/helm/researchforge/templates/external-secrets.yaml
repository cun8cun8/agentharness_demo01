{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.store.create }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.store.name }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.store.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.store.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.store.serviceAccount | quote }}
            namespace: external-secrets
    {{- else }}
    {{- fail "only the aws External Secrets provider is currently supported by this chart" }}
    {{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "researchforge.fullname" . }}-application-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ .Values.externalSecrets.application.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.application.remoteKey | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "researchforge.fullname" . }}-backup-s3
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: researchforge-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.backup.remoteKey | quote }}
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.backup.remoteKey | quote }}
        property: secret_access_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "researchforge.fullname" . }}-restore-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: researchforge-restore-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: restore-dsn
      remoteRef:
        key: {{ .Values.externalSecrets.restore.remoteKey | quote }}
        property: restore_dsn
{{- end }}
