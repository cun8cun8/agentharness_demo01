{{- if .Values.autoscaling.api.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "researchforge.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "researchforge.fullname" . }}-api
  minReplicas: {{ .Values.autoscaling.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.api.cpuTarget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "researchforge.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "researchforge.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "researchforge.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
{{- end }}
{{- if .Values.autoscaling.worker.kedaEnabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "researchforge.fullname" . }}-redis-auth
  namespace: {{ .Release.Namespace }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.externalSecrets.application.targetName }}
      key: REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "researchforge.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    name: {{ include "researchforge.fullname" . }}-worker
  minReplicaCount: {{ .Values.autoscaling.worker.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.worker.maxReplicas }}
  cooldownPeriod: {{ .Values.autoscaling.worker.cooldownPeriod }}
  triggers:
    - type: redis-streams
      metadata:
        address: {{ .Values.redis.address | quote }}
        stream: researchforge:jobs:stream
        consumerGroup: researchforge-workers
        pendingEntriesCount: "5"
        enableTLS: {{ ternary "true" "false" .Values.redis.tls | quote }}
      authenticationRef:
        name: {{ include "researchforge.fullname" . }}-redis-auth
{{- end }}
