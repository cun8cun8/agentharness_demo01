services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: researchforge
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge
    ports:
      - "127.0.0.1:${RESEARCHFORGE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge -d researchforge"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${RESEARCHFORGE_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      RESEARCHFORGE_ENV: container
      RESEARCHFORGE_API_HOST: 0.0.0.0
      RESEARCHFORGE_API_PORT: 8001
      RESEARCHFORGE_API_WORKERS: ${RESEARCHFORGE_API_WORKERS:-1}
      RESEARCHFORGE_PERSISTENCE: "1"
      RESEARCHFORGE_STORE_BACKEND: postgres
      RESEARCHFORGE_POSTGRES_DSN: postgresql://researchforge:researchforge@postgres:5432/researchforge
      RESEARCHFORGE_JOB_QUEUE_BACKEND: redis
      RESEARCHFORGE_REDIS_URL: redis://redis:6379/0
      RESEARCHFORGE_JOB_DELIVERY_MODE: ${RESEARCHFORGE_JOB_DELIVERY_MODE:-stream}
      RESEARCHFORGE_JOB_VISIBILITY_TIMEOUT_SECONDS: ${RESEARCHFORGE_JOB_VISIBILITY_TIMEOUT_SECONDS:-120}
      RESEARCHFORGE_JOB_WORKSPACE_CONCURRENCY: ${RESEARCHFORGE_JOB_WORKSPACE_CONCURRENCY:-1}
      RESEARCHFORGE_JOB_QUEUE_WAIT_TIMEOUT_SECONDS: ${RESEARCHFORGE_JOB_QUEUE_WAIT_TIMEOUT_SECONDS:-3600}
      RESEARCHFORGE_JOB_MAX_RETRIES: ${RESEARCHFORGE_JOB_MAX_RETRIES:-2}
      RESEARCHFORGE_JOB_WORKER_ENABLED: "0"
      RESEARCHFORGE_ARTIFACT_STORE_BACKEND: filesystem
      RESEARCHFORGE_ARTIFACT_STORE_PATH: /var/lib/researchforge/artifacts
      RESEARCHFORGE_REPOSITORY_CACHE_ROOT: /var/lib/researchforge/workspaces/repositories
      RESEARCHFORGE_SANDBOX_SHARED_WORKSPACE_ROOT: /var/lib/researchforge/workspaces
      RESEARCHFORGE_SANDBOX_BACKEND: ${RESEARCHFORGE_SANDBOX_BACKEND:-local}
      RESEARCHFORGE_SANDBOX_IMAGE: ${RESEARCHFORGE_SANDBOX_IMAGE:-python:3.12-slim}
      RESEARCHFORGE_SANDBOX_KUBERNETES_NAMESPACE: ${RESEARCHFORGE_SANDBOX_KUBERNETES_NAMESPACE:-default}
      RESEARCHFORGE_SANDBOX_KUBECONFIG: ${RESEARCHFORGE_SANDBOX_KUBECONFIG:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_SERVICE_ACCOUNT: ${RESEARCHFORGE_SANDBOX_KUBERNETES_SERVICE_ACCOUNT:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_WORKSPACE_PVC: ${RESEARCHFORGE_SANDBOX_KUBERNETES_WORKSPACE_PVC:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_IMAGE_PULL_POLICY: ${RESEARCHFORGE_SANDBOX_KUBERNETES_IMAGE_PULL_POLICY:-IfNotPresent}
      RESEARCHFORGE_SANDBOX_KUBERNETES_ACTIVE_DEADLINE_SECONDS: ${RESEARCHFORGE_SANDBOX_KUBERNETES_ACTIVE_DEADLINE_SECONDS:-600}
      RESEARCHFORGE_SANDBOX_KUBERNETES_KEEP_PODS: ${RESEARCHFORGE_SANDBOX_KUBERNETES_KEEP_PODS:-0}
      RESEARCHFORGE_NETWORK_ENABLED: ${RESEARCHFORGE_NETWORK_ENABLED:-0}
      RESEARCHFORGE_MODEL_PROVIDER: ${RESEARCHFORGE_MODEL_PROVIDER:-openai_compatible}
      RESEARCHFORGE_MODEL_API_KEY_ENV: ${RESEARCHFORGE_MODEL_API_KEY_ENV:-OPENAI_API_KEY}
      RESEARCHFORGE_MODEL_CATALOG: ${RESEARCHFORGE_MODEL_CATALOG:-[]}
      RESEARCHFORGE_MODEL_BASE_URL: ${RESEARCHFORGE_MODEL_BASE_URL:-}
      RESEARCHFORGE_MODEL_NAME: ${RESEARCHFORGE_MODEL_NAME:-}
      RESEARCHFORGE_RESEARCH_MODEL_NAME: ${RESEARCHFORGE_RESEARCH_MODEL_NAME:-}
      RESEARCHFORGE_EVENT_BUS_BACKEND: ${RESEARCHFORGE_EVENT_BUS_BACKEND:-redis}
      RESEARCHFORGE_EVENT_BUS_URL: ${RESEARCHFORGE_EVENT_BUS_URL:-redis://redis:6379/0}
      RESEARCHFORGE_EVENT_BUS_CHANNEL: ${RESEARCHFORGE_EVENT_BUS_CHANNEL:-researchforge:events}
      RESEARCHFORGE_API_KEY: ${RESEARCHFORGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RESEARCHFORGE_GITHUB_TOKEN: ${RESEARCHFORGE_GITHUB_TOKEN:-}
      RESEARCHFORGE_GITHUB_APP_ID: ${RESEARCHFORGE_GITHUB_APP_ID:-}
      RESEARCHFORGE_GITHUB_APP_PRIVATE_KEY: file:///run/secrets/github_app_private_key
      RESEARCHFORGE_GITHUB_WEBHOOK_SECRET: ${RESEARCHFORGE_GITHUB_WEBHOOK_SECRET:-}
      RESEARCHFORGE_GITHUB_WEBHOOK_PUBLIC_URL: ${RESEARCHFORGE_GITHUB_WEBHOOK_PUBLIC_URL:-}
      RESEARCHFORGE_GITHUB_ISSUE_TRIGGER_LABEL: ${RESEARCHFORGE_GITHUB_ISSUE_TRIGGER_LABEL:-researchforge}
      RESEARCHFORGE_GITHUB_CLIENT_ID: ${RESEARCHFORGE_GITHUB_CLIENT_ID:-}
      RESEARCHFORGE_GITHUB_CLIENT_SECRET: ${RESEARCHFORGE_GITHUB_CLIENT_SECRET:-}
      RESEARCHFORGE_GITHUB_OAUTH_STATE_SECRET: ${RESEARCHFORGE_GITHUB_OAUTH_STATE_SECRET:-}
      RESEARCHFORGE_GITHUB_REDIRECT_URI: ${RESEARCHFORGE_GITHUB_REDIRECT_URI:-${RESEARCHFORGE_FRONTEND_PUBLIC_URL:-http://127.0.0.1:3010/}}
    ports:
      - "127.0.0.1:${RESEARCHFORGE_API_HOST_PORT:-8001}:8001"
    volumes:
      - artifacts-data:/var/lib/researchforge/artifacts
      - workspace-data:/var/lib/researchforge/workspaces
      - ${RESEARCHFORGE_GITHUB_APP_PRIVATE_KEY_FILE:-../.run/local-full/github-app-private-key.pem}:/run/secrets/github_app_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      RESEARCHFORGE_ENV: container
      RESEARCHFORGE_API_HOST: 0.0.0.0
      RESEARCHFORGE_API_PORT: 8001
      RESEARCHFORGE_PERSISTENCE: "1"
      RESEARCHFORGE_STORE_BACKEND: postgres
      RESEARCHFORGE_POSTGRES_DSN: postgresql://researchforge:researchforge@postgres:5432/researchforge
      RESEARCHFORGE_JOB_QUEUE_BACKEND: redis
      RESEARCHFORGE_REDIS_URL: redis://redis:6379/0
      RESEARCHFORGE_JOB_DELIVERY_MODE: ${RESEARCHFORGE_JOB_DELIVERY_MODE:-stream}
      RESEARCHFORGE_JOB_VISIBILITY_TIMEOUT_SECONDS: ${RESEARCHFORGE_JOB_VISIBILITY_TIMEOUT_SECONDS:-120}
      RESEARCHFORGE_JOB_WORKSPACE_CONCURRENCY: ${RESEARCHFORGE_JOB_WORKSPACE_CONCURRENCY:-1}
      RESEARCHFORGE_JOB_QUEUE_WAIT_TIMEOUT_SECONDS: ${RESEARCHFORGE_JOB_QUEUE_WAIT_TIMEOUT_SECONDS:-3600}
      RESEARCHFORGE_JOB_MAX_RETRIES: ${RESEARCHFORGE_JOB_MAX_RETRIES:-2}
      RESEARCHFORGE_JOB_WORKER_ENABLED: "1"
      RESEARCHFORGE_ARTIFACT_STORE_BACKEND: filesystem
      RESEARCHFORGE_ARTIFACT_STORE_PATH: /var/lib/researchforge/artifacts
      RESEARCHFORGE_REPOSITORY_CACHE_ROOT: /var/lib/researchforge/workspaces/repositories
      RESEARCHFORGE_SANDBOX_SHARED_WORKSPACE_ROOT: /var/lib/researchforge/workspaces
      RESEARCHFORGE_SANDBOX_BACKEND: ${RESEARCHFORGE_SANDBOX_BACKEND:-local}
      RESEARCHFORGE_SANDBOX_IMAGE: ${RESEARCHFORGE_SANDBOX_IMAGE:-python:3.12-slim}
      RESEARCHFORGE_SANDBOX_KUBERNETES_NAMESPACE: ${RESEARCHFORGE_SANDBOX_KUBERNETES_NAMESPACE:-default}
      RESEARCHFORGE_SANDBOX_KUBECONFIG: ${RESEARCHFORGE_SANDBOX_KUBECONFIG:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_SERVICE_ACCOUNT: ${RESEARCHFORGE_SANDBOX_KUBERNETES_SERVICE_ACCOUNT:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_WORKSPACE_PVC: ${RESEARCHFORGE_SANDBOX_KUBERNETES_WORKSPACE_PVC:-}
      RESEARCHFORGE_SANDBOX_KUBERNETES_IMAGE_PULL_POLICY: ${RESEARCHFORGE_SANDBOX_KUBERNETES_IMAGE_PULL_POLICY:-IfNotPresent}
      RESEARCHFORGE_SANDBOX_KUBERNETES_ACTIVE_DEADLINE_SECONDS: ${RESEARCHFORGE_SANDBOX_KUBERNETES_ACTIVE_DEADLINE_SECONDS:-600}
      RESEARCHFORGE_SANDBOX_KUBERNETES_KEEP_PODS: ${RESEARCHFORGE_SANDBOX_KUBERNETES_KEEP_PODS:-0}
      RESEARCHFORGE_NETWORK_ENABLED: ${RESEARCHFORGE_NETWORK_ENABLED:-0}
      RESEARCHFORGE_MODEL_PROVIDER: ${RESEARCHFORGE_MODEL_PROVIDER:-openai_compatible}
      RESEARCHFORGE_MODEL_API_KEY_ENV: ${RESEARCHFORGE_MODEL_API_KEY_ENV:-OPENAI_API_KEY}
      RESEARCHFORGE_MODEL_CATALOG: ${RESEARCHFORGE_MODEL_CATALOG:-[]}
      RESEARCHFORGE_MODEL_BASE_URL: ${RESEARCHFORGE_MODEL_BASE_URL:-}
      RESEARCHFORGE_MODEL_NAME: ${RESEARCHFORGE_MODEL_NAME:-}
      RESEARCHFORGE_RESEARCH_MODEL_NAME: ${RESEARCHFORGE_RESEARCH_MODEL_NAME:-}
      RESEARCHFORGE_EVENT_BUS_BACKEND: ${RESEARCHFORGE_EVENT_BUS_BACKEND:-redis}
      RESEARCHFORGE_EVENT_BUS_URL: ${RESEARCHFORGE_EVENT_BUS_URL:-redis://redis:6379/0}
      RESEARCHFORGE_EVENT_BUS_CHANNEL: ${RESEARCHFORGE_EVENT_BUS_CHANNEL:-researchforge:events}
      RESEARCHFORGE_API_KEY: ${RESEARCHFORGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RESEARCHFORGE_GITHUB_TOKEN: ${RESEARCHFORGE_GITHUB_TOKEN:-}
      RESEARCHFORGE_GITHUB_APP_ID: ${RESEARCHFORGE_GITHUB_APP_ID:-}
      RESEARCHFORGE_GITHUB_APP_PRIVATE_KEY: file:///run/secrets/github_app_private_key
      RESEARCHFORGE_GITHUB_WEBHOOK_SECRET: ${RESEARCHFORGE_GITHUB_WEBHOOK_SECRET:-}
      RESEARCHFORGE_GITHUB_WEBHOOK_PUBLIC_URL: ${RESEARCHFORGE_GITHUB_WEBHOOK_PUBLIC_URL:-}
      RESEARCHFORGE_GITHUB_ISSUE_TRIGGER_LABEL: ${RESEARCHFORGE_GITHUB_ISSUE_TRIGGER_LABEL:-researchforge}
      RESEARCHFORGE_GITHUB_CLIENT_ID: ${RESEARCHFORGE_GITHUB_CLIENT_ID:-}
      RESEARCHFORGE_GITHUB_CLIENT_SECRET: ${RESEARCHFORGE_GITHUB_CLIENT_SECRET:-}
      RESEARCHFORGE_GITHUB_OAUTH_STATE_SECRET: ${RESEARCHFORGE_GITHUB_OAUTH_STATE_SECRET:-}
      RESEARCHFORGE_GITHUB_REDIRECT_URI: ${RESEARCHFORGE_GITHUB_REDIRECT_URI:-${RESEARCHFORGE_FRONTEND_PUBLIC_URL:-http://127.0.0.1:3010/}}
    volumes:
      - artifacts-data:/var/lib/researchforge/artifacts
      - workspace-data:/var/lib/researchforge/workspaces
      - ${RESEARCHFORGE_GITHUB_APP_PRIVATE_KEY_FILE:-../.run/local-full/github-app-private-key.pem}:/run/secrets/github_app_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        RESEARCHFORGE_BACKEND_URL: http://api:8001
    ports:
      - "127.0.0.1:${RESEARCHFORGE_FRONTEND_HOST_PORT:-3010}:3010"
    depends_on:
      - api
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-researchforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-researchforge}
    ports:
      - "127.0.0.1:${RESEARCHFORGE_MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RESEARCHFORGE_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
    ports:
      - "127.0.0.1:${RESEARCHFORGE_REDPANDA_HOST_PORT:-9092}:9092"

  prometheus:
    image: ${RESEARCHFORGE_PROMETHEUS_IMAGE:-prom/prometheus:v3.0.1}
    ports:
      - "127.0.0.1:${RESEARCHFORGE_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: ${RESEARCHFORGE_GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    ports:
      - "127.0.0.1:${RESEARCHFORGE_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: researchforge
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  redis-data:
  postgres-data:
  minio-data:
  grafana-data:
  artifacts-data:
  workspace-data:
