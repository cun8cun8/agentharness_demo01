apiVersion: v1
kind: Service
metadata:
  name: researchforge-api
  namespace: researchforge
  labels:
    app.kubernetes.io/name: researchforge-api
    app.kubernetes.io/part-of: researchforge
spec:
  selector:
    app.kubernetes.io/name: researchforge-api
  ports:
    - name: http
      port: 8001
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: researchforge-frontend
  namespace: researchforge
  labels:
    app.kubernetes.io/name: researchforge-frontend
    app.kubernetes.io/part-of: researchforge
spec:
  selector:
    app.kubernetes.io/name: researchforge-frontend
  ports:
    - name: http
      port: 3010
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchforge-frontend
  namespace: researchforge
  labels:
    app.kubernetes.io/name: researchforge-frontend
    app.kubernetes.io/part-of: researchforge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: researchforge-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: researchforge-frontend
        app.kubernetes.io/part-of: researchforge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: researchforge-frontend:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "server.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            - name: http
              containerPort: 3010
          startupProbe:
            httpGet:
              path: /tasks
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /tasks
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /tasks
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
