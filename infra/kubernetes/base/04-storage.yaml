apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: researchforge-artifacts
  namespace: researchforge
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: researchforge-sandbox-workspace
  namespace: researchforge
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
