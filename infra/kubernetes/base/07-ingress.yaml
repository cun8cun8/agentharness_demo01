apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: researchforge
  namespace: researchforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [researchforge.local]
      secretName: researchforge-tls
  rules:
    - host: researchforge.local
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: researchforge-api
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: researchforge-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: researchforge-frontend
                port:
                  name: http
