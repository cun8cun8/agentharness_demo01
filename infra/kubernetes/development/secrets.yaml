apiVersion: v1
kind: Secret
metadata:
  name: researchforge-secrets
  namespace: researchforge
type: Opaque
stringData:
  RESEARCHFORGE_API_KEY: "development-only-api-key"
  RESEARCHFORGE_POSTGRES_DSN: "postgresql://researchforge:researchforge@postgres:5432/researchforge"
  POSTGRES_PASSWORD: "researchforge"
  RESEARCHFORGE_REDIS_URL: "redis://redis:6379/0"
  RESEARCHFORGE_EVENT_BUS_URL: "redis://redis:6379/0"
  RESEARCHFORGE_GITHUB_CLIENT_ID: ""
  RESEARCHFORGE_GITHUB_CLIENT_SECRET: ""
  RESEARCHFORGE_GITHUB_OAUTH_STATE_SECRET: "development-only-oauth-state-secret"
  RESEARCHFORGE_ARTIFACT_STORE_ACCESS_KEY_ID: ""
  RESEARCHFORGE_ARTIFACT_STORE_SECRET_ACCESS_KEY: ""
  RESEARCHFORGE_METRICS_TOKEN: "development-only-metrics-token"
  OPENAI_API_KEY: ""
