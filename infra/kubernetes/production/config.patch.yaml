apiVersion: v1
kind: ConfigMap
metadata:
  name: researchforge-config
  namespace: researchforge
data:
  RESEARCHFORGE_ENV: "production"
  RESEARCHFORGE_AUTH_MODE: "production"
  RESEARCHFORGE_ALLOW_MOCK_MODELS: "0"
  RESEARCHFORGE_CORS_ORIGINS: "https://researchforge.example.invalid"
  RESEARCHFORGE_RATE_LIMIT_BACKEND: "redis"
  RESEARCHFORGE_WORKFLOW_BACKEND: "redis"
  RESEARCHFORGE_TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  RESEARCHFORGE_TEMPORAL_NAMESPACE: "default"
  RESEARCHFORGE_TEMPORAL_TASK_QUEUE: "researchforge-workflows"
  RESEARCHFORGE_NETWORK_ENABLED: "1"
  RESEARCHFORGE_SANDBOX_NETWORK_ENABLED: "0"
  RESEARCHFORGE_SANDBOX_KUBERNETES_RUNTIME_CLASS: ""
  RESEARCHFORGE_SANDBOX_KUBERNETES_EGRESS_RULES: "[]"
  RESEARCHFORGE_SANDBOX_IMAGE: "registry.example.invalid/researchforge/sandbox:REPLACE_WITH_IMMUTABLE_TAG"
  RESEARCHFORGE_TRAINING_IMAGE: "registry.example.invalid/researchforge/trainer:REPLACE_WITH_IMMUTABLE_TAG"
  RESEARCHFORGE_TRAINING_KUBERNETES_NODE_SELECTOR: "{}"
  RESEARCHFORGE_TRAINING_KUBERNETES_TOLERATIONS: "[]"
  RESEARCHFORGE_ARTIFACT_STORE_BACKEND: "s3"
  RESEARCHFORGE_ARTIFACT_STORE_BUCKET: "REPLACE_WITH_ARTIFACT_BUCKET"
  RESEARCHFORGE_ARTIFACT_STORE_PREFIX: "artifacts"
  RESEARCHFORGE_ARTIFACT_STORE_ENDPOINT_URL: "https://s3.example.invalid"
  RESEARCHFORGE_ARTIFACT_STORE_REGION: "us-east-1"
  RESEARCHFORGE_ARTIFACT_STORE_USE_SSL: "1"
  RESEARCHFORGE_ARTIFACT_STORE_AUTO_CREATE_BUCKET: "0"
  RESEARCHFORGE_ARTIFACT_STORE_SERVER_SIDE_ENCRYPTION: "aws:kms"
  RESEARCHFORGE_ARTIFACT_STORE_KMS_KEY_ID: "REPLACE_WITH_KMS_KEY_ID"
  RESEARCHFORGE_ARTIFACT_STORE_WORKSPACE_PREFIX: "1"
  RESEARCHFORGE_ARTIFACT_STORE_ACCESS_KEY_ID_ENV: "RESEARCHFORGE_ARTIFACT_STORE_ACCESS_KEY_ID"
  RESEARCHFORGE_ARTIFACT_STORE_SECRET_ACCESS_KEY_ENV: "RESEARCHFORGE_ARTIFACT_STORE_SECRET_ACCESS_KEY"
  RESEARCHFORGE_MODEL_BASE_URL: "https://model-gateway.example.invalid/v1"
  RESEARCHFORGE_MODEL_API_KEY_ENV: "OPENAI_API_KEY"
  RESEARCHFORGE_MODEL_NAME: "REPLACE_WITH_PRODUCTION_MODEL"
  RESEARCHFORGE_RESEARCH_MODEL_NAME: "REPLACE_WITH_RESEARCH_MODEL"
  RESEARCHFORGE_GITHUB_REDIRECT_URI: "https://researchforge.example.invalid/"
  RESEARCHFORGE_GITHUB_WEBHOOK_PUBLIC_URL: "https://researchforge.example.invalid/api/v1/integrations/github/webhook"
