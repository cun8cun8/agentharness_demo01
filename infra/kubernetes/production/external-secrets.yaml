# Requires External Secrets Operator and a ClusterSecretStore named
# researchforge-production-secrets. Remote secret values are never committed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: researchforge-application-secrets
  namespace: researchforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: researchforge-production-secrets
  target:
    name: researchforge-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: researchforge/production/application
---
# This remote secret must provide access_key_id and secret_access_key properties
# with permission limited to backup and WAL prefixes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: researchforge-backup-s3
  namespace: researchforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: researchforge-production-secrets
  target:
    name: researchforge-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: researchforge/production/postgres-backup
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: researchforge/production/postgres-backup
        property: secret_access_key
---
# A restore drill has its own isolated database endpoint and credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: researchforge-restore-secrets
  namespace: researchforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: researchforge-production-secrets
  target:
    name: researchforge-restore-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: restore-dsn
      remoteRef:
        key: researchforge/production/restore-drill
        property: restore_dsn
