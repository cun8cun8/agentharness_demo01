name: Release ResearchForge
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy tested images to the protected production environment
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
concurrency:
  group: researchforge-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          package = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          expected = f"v{package['version']}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match frontend version {expected!r}")
          print(f"validated release tag {tag}")
          PY
      - name: Validate open-source release prerequisites
        run: python backend/scripts/oss_preflight.py
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate reproducible release manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          VERSION="$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; fi
          python backend/scripts/release_manifest.py \
            --output release-manifest.json \
            --version "$VERSION" \
            --require-images \
            --image "api=$IMAGE-api:$REVISION" \
            --image "frontend=$IMAGE-frontend:$REVISION" \
            --image "sandbox=$IMAGE-sandbox:$REVISION" \
            --image "trainer=$IMAGE-trainer:$REVISION"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: KUBECTL_VERSION=${{ vars.KUBECTL_VERSION || 'v1.37.1' }}
          push: true
          tags: ${{ steps.image.outputs.name }}-api:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: RESEARCHFORGE_BACKEND_URL=http://researchforge-api:8001
          push: true
          tags: ${{ steps.image.outputs.name }}-frontend:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.sandbox
          push: true
          tags: ${{ steps.image.outputs.name }}-sandbox:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.trainer
          push: true
          tags: ${{ steps.image.outputs.name }}-trainer:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Verify offline trainer compatibility
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$GITHUB_WORKSPACE/backend/tests/trainer_smoke.py:/tmp/trainer-smoke.py:ro" \
            "$IMAGE-trainer:$REVISION" /tmp/trainer-smoke.py
      - name: Scan images for high and critical vulnerabilities
        id: vulnerability_scan
        continue-on-error: true
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p .run/trivy
          failures=0
          for component in api frontend sandbox trainer; do
            set +e
            docker run --rm -v "$HOME/.docker:/root/.docker:ro" -v "$GITHUB_WORKSPACE/.run/trivy:/reports" aquasec/trivy:0.75.0 image --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL --format json --output "/reports/$component.json" "$IMAGE-$component:$REVISION"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then failures=1; fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
      - name: Upload image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researchforge-image-vulnerability-reports-${{ github.sha }}
          path: .run/trivy
          if-no-files-found: error
          retention-days: 90
      - name: Block high and critical image vulnerabilities
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.vulnerability_scan.outcome }}
          SCAN_FAILURES: ${{ steps.vulnerability_scan.outputs.failures }}
        run: |
          test "$SCAN_OUTCOME" = "success"
          test "$SCAN_FAILURES" = "0"
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: researchforge-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-manifest.json --verify-tag --title "ResearchForge $RELEASE_TAG" --generate-notes
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Production cluster preflight
        run: python backend/scripts/cluster_preflight.py --namespace researchforge
      - name: Rolling deployment
        id: rollout
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REVISION: ${{ github.sha }}
        run: |
          kubectl -n researchforge patch deployment researchforge-api --type=strategic --patch "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"api\",\"image\":\"$IMAGE-api:$REVISION\",\"env\":[{\"name\":\"RESEARCHFORGE_SANDBOX_IMAGE\",\"value\":\"$IMAGE-sandbox:$REVISION\"},{\"name\":\"RESEARCHFORGE_TRAINING_IMAGE\",\"value\":\"$IMAGE-trainer:$REVISION\"}]}]}}}}"
          kubectl -n researchforge rollout status deployment/researchforge-api --timeout=300s
          kubectl -n researchforge patch deployment researchforge-worker --type=strategic --patch "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"worker\",\"image\":\"$IMAGE-api:$REVISION\",\"env\":[{\"name\":\"RESEARCHFORGE_SANDBOX_IMAGE\",\"value\":\"$IMAGE-sandbox:$REVISION\"},{\"name\":\"RESEARCHFORGE_TRAINING_IMAGE\",\"value\":\"$IMAGE-trainer:$REVISION\"}]}]}}}}"
          kubectl -n researchforge rollout status deployment/researchforge-worker --timeout=300s
          kubectl -n researchforge patch deployment researchforge-frontend --type=strategic --patch "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"frontend\",\"image\":\"$IMAGE-frontend:$REVISION\"}]}}}}"
          kubectl -n researchforge rollout status deployment/researchforge-frontend --timeout=300s
      - name: Authenticated dependency acceptance
        env:
          RESEARCHFORGE_API_KEY: ${{ secrets.PROBE_API_KEY }}
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: python backend/scripts/acceptance_probe.py --base-url "$BASE_URL" --production
      - name: Read-only production load acceptance
        env:
          RESEARCHFORGE_API_KEY: ${{ secrets.PROBE_API_KEY }}
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          LOAD_REQUESTS: ${{ vars.PRODUCTION_LOAD_REQUESTS || '100' }}
          LOAD_CONCURRENCY: ${{ vars.PRODUCTION_LOAD_CONCURRENCY || '10' }}
          MAX_P95_MS: ${{ vars.PRODUCTION_MAX_P95_MS || '1000' }}
        run: |
          python backend/scripts/load_probe.py --base-url "$BASE_URL" --path /api/v1/system/readiness --requests "$LOAD_REQUESTS" --concurrency "$LOAD_CONCURRENCY" --max-p95-ms "$MAX_P95_MS"
      - name: Roll back failed deployment
        if: failure() && steps.rollout.outcome != 'skipped'
        run: |
          kubectl -n researchforge rollout undo deployment/researchforge-api
          kubectl -n researchforge rollout undo deployment/researchforge-worker
          kubectl -n researchforge rollout undo deployment/researchforge-frontend
          kubectl -n researchforge rollout status deployment/researchforge-api --timeout=300s
          kubectl -n researchforge rollout status deployment/researchforge-worker --timeout=300s
          kubectl -n researchforge rollout status deployment/researchforge-frontend --timeout=300s
      - name: Remove runner credentials
        if: always()
        run: rm -f "$HOME/.kube/config"
